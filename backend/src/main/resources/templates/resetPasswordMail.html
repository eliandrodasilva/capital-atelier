<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Recuperação de Senha - Capital Atelier</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #09090b; color: #f4f4f5; padding: 20px;">
    <div
        style="max-width: 600px; margin: 0 auto; background-color: #18181b; padding: 30px; border-radius: 12px; border: 1px solid #27272a;">
        <h2 style="color: #f4f4f5; margin-bottom: 20px;">Recuperação de Senha</h2>
        <p>Olá, <span th:text="${name}">Usuário</span>!</p>
        <p>Recebemos uma solicitação para redefinir a sua senha no <strong>Capital Atelier</strong>.</p>
        <p>Clique no botão abaixo para criar uma nova senha:</p>
        <p style="margin: 30px 0; text-align: center;">
            <a th:href="${resetLink}"
                style="background-color: #f4f4f5; color: #09090b; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 6px; display: inline-block;">Redefinir
                Senha</a>
        </p>
        <p style="color: #a1a1aa; font-size: 13px;">Se você não solicitou a alteração da sua senha, desconsidere este
            e-mail.</p>
        <p style="color: #a1a1aa; font-size: 13px;">Ou não... você quem sabe.</p>
    </div>
</body>

</html>
