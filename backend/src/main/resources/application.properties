spring.application.name=backend
server.port=${PORT:8080}
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/capital_atelier?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:${MAIL_USERNAME:}}
brevo.sender.name=${BREVO_SENDER_NAME:Capital Atelier}

jwt.secret=${JWT_SECRET:}

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed.enabled=${APP_SEED_ENABLED:true}
